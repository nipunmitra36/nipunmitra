            <!-- Messages are delivered to nipunmitra03@gmail.com via FormSubmit (formsubmit.co).
                 main.js sends it in the background; without JavaScript the form posts there directly. -->
            <form id="contact-form" action="https://formsubmit.co/nipunmitra03@gmail.com" method="POST" class="space-y-4 self-start">
              <input type="hidden" name="_subject" value="New message from your portfolio" />
              <input type="hidden" name="_template" value="table" />
              <input type="hidden" name="_captcha" value="false" />
              <!-- honeypot: real visitors never see or fill this -->
              <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden" />
              <div class="grid gap-4 sm:grid-cols-2">
                <label class="block">
                  <span class="mb-1.5 block text-sm text-slate-400">Name</span>
                  <input name="name" required autocomplete="name" placeholder="Your name" class="w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-nebula-violet focus:ring-2 focus:ring-nebula-violet/30" />
                </label>
                <label class="block">
                  <span class="mb-1.5 block text-sm text-slate-400">Email</span>
                  <input name="email" type="email" required autocomplete="email" placeholder="you@example.com" class="w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-nebula-violet focus:ring-2 focus:ring-nebula-violet/30" />

              </div>
              <label class="block">

              </label>
              <label class="block">
                <span class="mb-1.5 block text-sm text-slate-400">Message</span>
                <textarea name="message" rows="6" required placeholder="Tell me a little about your project..." class="w-full resize-none rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-nebula-violet focus:ring-2 focus:ring-nebula-violet/30"></textarea>
              </label>
              <button type="submit" class="group flex w-full items-center justify-center gap-3 rounded-xl bg-gradient-to-r from-nebula-violet to-nebula-cyan py-4 font-semibold text-white transition duration-300 hover:shadow-[0_0_40px_rgba(139,92,246,.45)] disabled:cursor-wait disabled:opacity-70">

              </button>
              <p id="form-status" role="status" aria-live="polite" class="hidden rounded-xl border px-4 py-3 text-sm"></p>
