[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/opt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Search API: Netlify Functions live in netlify/functions/ (the default directory, stated explicitly).
# Each function sets its own route and rate limit in its `config` export.
[functions]
  directory = "netlify/functions"

# The OpenAPI / tool definitions are static JSON that AI apps may fetch from a browser.
[[headers]]
  for = "/api/v1/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

# `netlify dev`: serve the built site from dist/ alongside the functions.
[dev]
  publish = "dist"
  autoLaunch = false

# App downloads (APK files only, kept in /apk/ so this never touches /downloads, the page): correct Android type, always download (never display), cache a day.
[[headers]]
  for = "/apk/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex"
